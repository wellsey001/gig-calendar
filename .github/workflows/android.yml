# Builds the Earshot Android app (a Trusted Web Activity that opens the live site)
# and publishes the signed APK on the repository's Releases page.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64  the signing keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_PASSWORD
#   ANDROID_KEY_ALIAS        optional, defaults to my-key-alias (PWABuilder's default)
#
# Run it from the Actions tab ("Build Android app" > "Run workflow"). It also runs
# automatically when the app's name, icons or Android settings change.

name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'manifest.json'
      - 'icon-*.png'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - name: Check the signing secrets are set
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$BUBBLEWRAP_KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$BUBBLEWRAP_KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets before building:$missing"
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Bubblewrap
        run: |
          set -o pipefail
          npm install -g @bubblewrap/cli 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          bubblewrap --version 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Point Bubblewrap at the runner's Java and Android SDK
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ls "$ANDROID_HOME" "$ANDROID_HOME/build-tools" 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Unpack the signing key and set the version
        working-directory: android
        run: |
          # Tidy up stray spaces or line breaks from copying and pasting
          ks_pass=$(printf '%s' "$BUBBLEWRAP_KEYSTORE_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          key_pass=$(printf '%s' "$BUBBLEWRAP_KEY_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          alias=$(printf '%s' "${KEY_ALIAS:-my-key-alias}" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          echo "::add-mask::$ks_pass"; echo "::add-mask::$key_pass"
          echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$ks_pass" >> "$GITHUB_ENV"
          echo "BUBBLEWRAP_KEY_PASSWORD=$key_pass" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$alias" >> "$GITHUB_ENV"

          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > android.keystore 2>/dev/null \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 isn't valid. Paste the whole of keystore-base64.txt again, with nothing added."; exit 1; }
          size=$(wc -c < android.keystore)
          echo "Keystore: $size bytes, fingerprint $(sha256sum android.keystore | cut -c1-16)"
          [ "$size" -gt 1000 ] || { echo "::error::ANDROID_KEYSTORE_BASE64 looks cut short ($size bytes). Paste the whole of keystore-base64.txt again."; exit 1; }
          # Fingerprint of the Earshot key made on 2026-11-17 (a hash of the file, not a secret).
          # If you replace the key on purpose, update or remove this check.
          expected="79684a88ff5527e073e8f582b4ec90307f6aab2da86c83a0a944e23f4c0030b8"
          actual=$(sha256sum android.keystore | cut -d' ' -f1)
          [ "$actual" = "$expected" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 isn't the Earshot key ($size bytes, fingerprint ${actual:0:16}; expected 2660 bytes, ${expected:0:16}). Paste the whole of keystore-base64.txt into it again, not earshot.keystore."; exit 1; }

          keytool -list -keystore android.keystore -storepass "$ks_pass" > keys.txt 2>&1 \
            || { echo "::error::ANDROID_KEYSTORE_PASSWORD doesn't open this keystore. Copy the keystore password again from signing-key-info.txt."; echo "keytool said:"; grep -v JAVA_TOOL keys.txt | head -3; echo "Password received: ${#ks_pass} characters, starting ${ks_pass:0:2}, ending ${ks_pass: -2} (should be 24, y2, gP)"; exit 1; }
          grep -qi "^$alias," keys.txt \
            || { echo "::error::No key called '$alias' in the keystore. Set ANDROID_KEY_ALIAS to: $(grep -i PrivateKeyEntry keys.txt | cut -d, -f1 | head -1)"; exit 1; }
          rm -f keys.txt

          jq --arg alias "$alias" \
             --argjson code "${{ github.run_number }}" \
             --arg name "1.0.${{ github.run_number }}" \
             '.signingKey.alias = $alias | .appVersionCode = $code | .appVersionName = $name' \
             twa-manifest.json > twa.tmp && mv twa.tmp twa-manifest.json

      - name: Generate the Android project
        working-directory: android
        run: |
          set -o pipefail
          echo '--- bubblewrap update ---' >> "$RUNNER_TEMP/build.log"
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json < /dev/null 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Build the signed APK
        working-directory: android
        run: |
          set -o pipefail
          echo '--- bubblewrap build ---' >> "$RUNNER_TEMP/build.log"
          bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json < /dev/null 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          ls -la | tee -a "$RUNNER_TEMP/build.log"

      - name: Make assetlinks.json (hides the browser bar)
        working-directory: android
        run: |
          alias="$KEY_ALIAS"
          sha=$(keytool -list -v -keystore android.keystore -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" -alias "$alias" \
                | sed -n 's/.*SHA256: *//p' | head -1 | tr -d '[:space:]')
          pkg=$(jq -r .packageId twa-manifest.json)
          jq -n --arg pkg "$pkg" --arg sha "$sha" \
            '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":$pkg,"sha256_cert_fingerprints":[$sha]}}]' \
            > assetlinks.json
          cp app-release-signed.apk "Earshot-1.0.${{ github.run_number }}.apk"
          rm -f android.keystore

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-1.0.${{ github.run_number }}"
          gh release create "$tag" \
            "android/Earshot-1.0.${{ github.run_number }}.apk" \
            "android/assetlinks.json" \
            --title "Earshot for Android 1.0.${{ github.run_number }}" \
            --notes "Download the .apk below and open it on your Android phone to install. It installs over earlier versions and keeps your gigs." \
            --latest

      - name: Report what went wrong
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/build.log" ] || exit 0
          # Put the end of the log in the error message, so it shows on the run's summary
          tail -n 40 "$RUNNER_TEMP/build.log" | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' | grep -v '^[[:space:]]*$' | tail -n 30 > tail.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' tail.txt)
          echo "::error title=Build log::$msg"
