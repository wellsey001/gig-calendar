# Temporary: checks how MusicBrainz answers Earshot's release search. Removed after use.
name: MusicBrainz probe
on:
  push:
    paths: ['.github/workflows/mb-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Mobile Safari/537.36'
          T=$(date -u +%F); F=$(date -u -d '-90 days' +%F)
          probe() {
            label="$1"; q="$2"
            code=$(curl -sS -m 30 -o out.json -D hdr.txt -w '%{http_code}' -A "$UA" -H 'Origin: https://wellsey001.github.io' -H 'Accept: application/json' \
              -G 'https://musicbrainz.org/ws/2/release-group' --data-urlencode "query=$q" --data-urlencode 'limit=100' --data-urlencode 'fmt=json')
            cors=$(grep -iE '^(x-ratelimit|retry-after)' hdr.txt | tr -d '\r' | tr '\n' ' ')
            summary=$(python3 -c "
          import json,sys
          try:
            d=json.load(open('out.json'))
            print('count', d.get('count'), '|', '; '.join(f\"{g.get('first-release-date')} {g['title']} ({', '.join(a.get('name','') for a in g.get('artist-credit',[]))})\" for g in d.get('release-groups',[])[:6]))
          except Exception as e: print('not json:', open('out.json').read()[:300].replace(chr(10),' '))")
            echo "::notice title=$label::HTTP $code | $cors | $summary"
            sleep 6
          }
          N='"Taylor Swift" OR "Radiohead" OR "Lorde" OR "Arctic Monkeys" OR "Florence + the Machine" OR "Wet Leg" OR "IDLES" OR "Fontaines D.C." OR "The National" OR "Bon Iver" OR "Phoebe Bridgers" OR "Sam Fender" OR "Blur" OR "Pulp" OR "Gorillaz"'
          probe "0 warm-up" "artist:\"Lorde\""
          probe "1 current query" "firstreleasedate:[$F TO 2099-12-31] AND (artistname:($N) OR artist:($N))"
          probe "2 range only, one name" "firstreleasedate:[$T TO 2099-12-31] AND artist:\"Taylor Swift\""
          probe "3 range with star" "firstreleasedate:[$F TO *] AND artist:(\"Radiohead\" OR \"Lorde\")"
          probe "4 no range" "artist:(\"Radiohead\" OR \"Lorde\")"
          probe "5 arid-free short" "artistname:(\"Sam Fender\") AND firstreleasedate:[$F TO 2099-12-31]"
          probe "6 range then names (no OR across fields)" "firstreleasedate:[$F TO 2099-12-31] AND artist:($N)"
          probe "7 names then range" "artist:($N) AND firstreleasedate:[$F TO 2099-12-31]"
          probe "8 names, type filter, no range" "artist:($N) AND primarytype:(album OR ep OR single)"
          probe "9 repeat current query" "firstreleasedate:[$F TO 2099-12-31] AND (artistname:($N) OR artist:($N))"
